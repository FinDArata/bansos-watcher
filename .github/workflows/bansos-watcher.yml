name: Bansos Watcher

on:
  schedule:
    - cron: ''*/30 * * * *''
  workflow_dispatch:
    description: ''Trigger manual untuk tes notifikasi''

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ''20''
      - name: Run check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/check-bansos.mjs
      - name: Commit state if changed
        run: |
          git config user.name ''bansos-watcher-bot''
          git config user.email ''bansos-watcher-bot@users.noreply.github.com''
          git add state.json
          git diff --cached --quiet || git commit -m ''chore(state): update bansos state [skip ci]''
          git push || echo ''Nothing to commit or push failed''
