name: Bansos Watcher

on:
  schedule:
    - cron: '5 23 * * *'
    - cron: '5 5 * * *'
    - cron: '5 11 * * *'
    - cron: '5 17 * * *'
  workflow_dispatch:
    description: 'Trigger manual untuk tes notifikasi'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Run check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/check-bansos.mjs
      - name: Commit state if changed
        run: |
          git config user.name 'bansos-watcher-bot'
          git config user.email 'bansos-watcher-bot@users.noreply.github.com'
          git add state.json
          git diff --cached --quiet || git commit -m 'chore(state): update bansos state [skip ci]'
          git push || echo 'Nothing to commit or push failed'
